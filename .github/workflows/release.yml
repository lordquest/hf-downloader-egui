name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows exe
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: target/x86_64-pc-windows-msvc/release/hf-downloader-egui.exe
          # Intentionally off: GitHub's auto-generated notes only list merged pull
          # requests, and this project pushes commits straight to `main`, so they came
          # out empty. The `release-notes` job below writes notes from the commits.
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Download a CJK font for self-contained Chinese rendering
        # Noto Sans CJK (OFL license, see fonts/OFL.txt). Bundled into the
        # release so the Linux binary shows Chinese without a system CJK font.
        run: |
          curl -fsSL -o fonts/NotoSansCJKsc-Regular.otf \
            "https://github.com/notofonts/noto-cjk/raw/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf" \
            || echo "::warning::CJK font download failed; Linux build will rely on system fonts"

      - name: Build release
        run: cargo build --release

      - name: Package release tarball
        run: |
          tar -czf hf-downloader-egui-linux.tar.gz -C target/release \
            hf-downloader-egui lang fonts

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: hf-downloader-egui-linux.tar.gz
          # Intentionally off: GitHub's auto-generated notes only list merged pull
          # requests, and this project pushes commits straight to `main`, so they came
          # out empty. The `release-notes` job below writes notes from the commits.
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build macOS universal binary
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable) with macOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Download a CJK font for self-contained Chinese rendering
        # Noto Sans CJK (OFL license, see fonts/OFL.txt). Bundled into the
        # release so the macOS binary shows Chinese without a system CJK font.
        run: |
          curl -fsSL -o fonts/NotoSansCJKsc-Regular.otf \
            "https://github.com/notofonts/noto-cjk/raw/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf" \
            || echo "::warning::CJK font download failed; macOS build will rely on system fonts"

      - name: Build release for both architectures
        run: |
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin

      - name: Create universal binary
        run: |
          lipo -create -output hf-downloader-egui \
            target/x86_64-apple-darwin/release/hf-downloader-egui \
            target/aarch64-apple-darwin/release/hf-downloader-egui

      - name: Package release tarball
        run: |
          mkdir -p pkg
          cp hf-downloader-egui pkg/
          cp -R target/aarch64-apple-darwin/release/lang pkg/
          cp -R target/aarch64-apple-darwin/release/fonts pkg/
          tar -czf hf-downloader-egui-macos.tar.gz -C pkg .

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: hf-downloader-egui-macos.tar.gz
          # Intentionally off: GitHub's auto-generated notes only list merged pull
          # requests, and this project pushes commits straight to `main`, so they came
          # out empty. The `release-notes` job below writes notes from the commits.
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-notes:
    name: Write release notes from commits
    # Runs after the platform builds so the release (created by whichever upload lands
    # first) already exists, letting a single job own the body instead of three racing.
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history: the default shallow clone can't resolve the previous tag.
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build changelog from commit messages
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Most recent tag reachable before this one; empty on the very first release.
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          {
            echo "## What's Changed"
            echo
            if [ -n "$PREV" ]; then
              git log --no-merges --pretty=format:'- %s (%h)' "${PREV}..${TAG}"
            else
              git log --no-merges --pretty=format:'- %s (%h)' "${TAG}"
            fi
            echo
            echo
            if [ -n "$PREV" ]; then
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
            fi
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Update release body
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
