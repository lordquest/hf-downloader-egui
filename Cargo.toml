[package]
name = "hf-downloader-egui"
version = "0.2.4"
edition = "2021"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.29"
# rustls-tls is pure-Rust (no system OpenSSL/SChannel dependency), so the binary
# stays self-contained on both Windows and Linux.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "http2", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
url = "2"
regex = "1"
rfd = "0.15"
sys-locale = "0.3"
# Cross-platform system clipboard access for the right-click Paste menu.
arboard = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
